[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ssbmhk-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["melee==0.47.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ssbmhk-verify-iso = "ssbmhk_tools.cli:verify_iso_main"
ssbmhk-oracle-replay = "ssbmhk_tools.cli:oracle_replay_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["oracle: needs Slippi Dolphin, the ISO and dev.toml (run with --run-oracle)"]
