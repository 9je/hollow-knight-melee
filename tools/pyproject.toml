[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ssbmhk-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["melee==0.47.3", "UnityPy==1.10.18", "Pillow", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ssbmhk-verify-iso = "ssbmhk_tools.cli:verify_iso_main"
ssbmhk-oracle-replay = "ssbmhk_tools.cli:oracle_replay_main"
ssbmhk-recomp-insn-tests = "ssbmhk_tools.recomp.cli:insn_tests_main"
ssbmhk-recomp = "ssbmhk_tools.recomp.cli:recomp_main"
ssbmhk-replay-check = "ssbmhk_tools.replaycheck:main"
ssbmhk-hk-rooms = "ssbmhk_tools.hkrooms:main"
ssbmhk-room-png = "ssbmhk_tools.roompng:main"
ssbmhk-extract-fox = "ssbmhk_tools.foxmodel:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["oracle: needs Slippi Dolphin, the ISO and dev.toml (run with --run-oracle)"]
